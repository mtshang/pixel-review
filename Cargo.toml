[package]
name = "pixel-review"
version = "1.11.0"
edition = "2021"
publish = false

[dependencies]
png = "0.18"
serde_json = "1"
pico-args = "0.5"
tempfile = "3"
windows-sys = { version = "0.61", features = ["Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
